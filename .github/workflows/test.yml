name: Tests
run-name: ${{ github.actor }} is testing out NPU flow
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  Test:
    runs-on: self-hosted # Ubuntu 24.04
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "The name of the branch is ${{ github.ref }}."

      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT_TOKEN }}
          submodules: 'recursive'

      - name: Update apt list
        run: sudo apt update
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}

      - name: Install XRT
        run: ./.github/scripts/install_ci_xrt.sh

      - name: Install MLIR-AIE
        run: |
          source ./.github/scripts/install_mlir_aie.sh ${{ github.workspace }}
          echo MLIR_AIE_INSTALL_DIR=$MLIR_AIE_INSTALL_DIR >> $GITHUB_ENV
          echo PEANO_INSTALL_DIR=$PEANO_INSTALL_DIR >> $GITHUB_ENV
          echo PATH=$PATH >> $GITHUB_ENV
          echo PYTHONPATH=$PYTHONPATH >> $GITHUB_ENV
          echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH >> $GITHUB_ENV
          echo PEANO_CLANG=$PEANO_CLANG >> $GITHUB_ENV
          echo NPU2=1 >> $GITHUB_ENV

      - name: Install OR-Tools
        run: |
          source ./.github/scripts/install_or_tools.sh 24.04
          echo OR_TOOLS_DIR=$OR_TOOLS_DIR >> $GITHUB_ENV
          echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH >> $GITHUB_ENV
          echo CPATH=$CPATH >> $GITHUB_ENV
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Build PnR Tool
        run: |
          sudo apt install -y catch2
          cd npu-pnr
          mkdir build && cd build
          cmake .. -DCMAKE_PREFIX_PATH=$OR_TOOLS_DIR -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          echo NPU_PNR_BIN_DIR=$(realpath ./apps) >> $GITHUB_ENV
          make test

      - name: Build Placed-IRON Benchmarks Standard Flow
        run: |
          source ./mlir-aie/ironenv/bin/activate
          mkdir -p build
          python3 utils/build_benchmarks.py benchmarks/tasklist.yml --benchmark-root=benchmarks \
            --build --placed-iron \
            --output-dir=./build/placed --verbose
          python3 utils/parse_results.py --variant=std \
            --input-dir=./build/placed --output-csv=placed_std_results.csv

      - name: Build Placed-IRON Benchmarks PnR Flow
        run: |
          source ./mlir-aie/ironenv/bin/activate
          mkdir -p build
          python3 utils/build_benchmarks.py benchmarks/tasklist.yml --benchmark-root=benchmarks \
            --build --placed-iron \
            --pnr --pnr-args="-n 0" \
            --output-dir=./build/placed_pnr_replace --verbose
          python3 utils/parse_results.py --variant=pnr \
            --input-dir=./build/placed_pnr_replace --output-csv=placed_pnr_replace_results.csv

      - name: Build Unplaced-IRON (w/ Sequential Placer) Benchmarks Standard Flow
        run: |
          source ./mlir-aie/ironenv/bin/activate
          mkdir -p build
          python3 utils/build_benchmarks.py benchmarks/tasklist.yml --benchmark-root=benchmarks \
            --build --no-placed-iron --iron-placer="sequential_placer" \
            --output-dir=./build/unplaced_seq --verbose
          python3 utils/parse_results.py --variant=std \
            --input-dir=./build/unplaced_seq --output-csv=unplaced_seq_std_results.csv

      - name: Build Unplaced-IRON (w/ SA Placer) Benchmarks
        run: |
          source ./mlir-aie/ironenv/bin/activate
          mkdir -p build
          python3 utils/build_benchmarks.py benchmarks/tasklist.yml --benchmark-root=benchmarks \
            --build --no-placed-iron --iron-placer="sa_placer" \
            --pnr --pnr-args="-n 0" \
            --output-dir=./build/unplaced_sa --verbose
          python3 utils/parse_results.py --variant=pnr \
            --input-dir=./build/unplaced_sa --output-csv=unplaced_sa_pnr_results.csv

      - name: Store Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/
          if-no-files-found: 'error'

      - name: Store Result Tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-tables
          path: |
            placed_std_results.csv
            placed_pnr_replace_results.csv
            unplaced_seq_std_results.csv
            unplaced_sa_pnr_results.csv
          if-no-files-found: 'error'
